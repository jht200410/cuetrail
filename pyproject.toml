[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cuetrail-memory"
version = "0.1.0"
description = "Conditional procedural memory with extractive provenance and bounded intent triggers"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "CueTrail contributors"}]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
